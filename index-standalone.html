:root{--ac:#7c3aed;--nv:#111b4d;--bg:#05060f;--tx:#eef0ff;--mu:color-mix(in srgb,var(--tx) 62%,var(--bg));--radius:14px;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
a{color:inherit;text-decoration:none}
h1,h2,h3{margin:0 0 .6rem}

.wrap{max-width:1100px;margin:auto;padding:2rem 1.2rem}
.row{display:flex;gap:.75rem;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}
.grid{display:grid;gap:1rem}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem}
.btn{display:inline-block;background:var(--ac);color:#fff;border:0;border-radius:calc(var(--radius) * .7);padding:.55rem 1.1rem;font:600 .95rem Cairo,sans-serif;cursor:pointer}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--ac)}
.btn.full{width:100%;margin-top:1rem;text-align:center}
.inp{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--line);border-radius:calc(var(--radius) * .7);padding:.55rem .8rem;font:inherit}
.inp[type=color]{padding:.2rem;height:2.6rem}.inp[type=range]{padding:0}
.inp:focus,.btn:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:block;font-size:.85rem;color:var(--mu);margin:.7rem 0 .25rem}
.brand{display:flex;align-items:center;gap:.5rem;font-weight:800;font-size:1.15rem}.bl{font-size:1.5rem}
.top{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
.links{display:flex;gap:1.2rem;color:var(--mu);font-size:.9rem}
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:2rem;align-items:center}
.hero h1{font-size:clamp(1.9rem,5vw,3rem);line-height:1.25;font-weight:800}
.step b{font-size:2rem;color:var(--ac)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
th{color:var(--mu);font-weight:600;text-align:start;padding:.6rem;border-bottom:1px solid var(--line)}
td{padding:.6rem;border-bottom:1px solid color-mix(in srgb,var(--line) 50%,transparent);vertical-align:middle}
.tag{padding:.1rem .6rem;border-radius:99px;font-size:.78rem;font-weight:600;white-space:nowrap}
details{border-bottom:1px solid var(--line);padding:.8rem 0}summary{cursor:pointer;font-weight:600}
footer{border-top:1px solid var(--line);padding:1.5rem 1.2rem;color:var(--mu);font-size:.9rem}
.layout{display:flex;min-height:100vh}
.side{width:15rem;flex:none;background:var(--card);border-inline-end:1px solid var(--line);padding:.8rem;position:sticky;top:0;align-self:flex-start;min-height:100vh}
.side .brand{padding:.4rem .5rem 1rem}

/* لا تظهر شاشة بيضاء أبداً: أي خطأ في التحميل أو التشغيل يُكتب على الشاشة */
function bootFail(msg){var a=document.getElementById('app');if(!a||a.dataset.ok)return;
 a.innerHTML='<div style="max-width:560px;margin:3rem auto;padding:1rem;border:1px solid #7c3aed;border-radius:12px"><b>تعذّر تشغيل الموقع</b><p style="opacity:.85;direction:ltr;text-align:left;word-break:break-all">'+String(msg).replace(/</g,'&lt;')+'</p><p style="opacity:.85">افتح الموقع من رابط الخادم (Render أو uvicorn)، أو املأ ملف config.js. وأرسل لي السطر اللي فوق لو المشكلة استمرت.</p></div>'}
window.addEventListener('error',function(e){var t=e.target;if(t&&t.tagName==='SCRIPT')bootFail('Failed to load: '+t.src);else if(!t||t===window)bootFail(e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')')},true);
window.addEventListener('unhandledrejection',function(e){bootFail(e.reason&&e.reason.message||e.reason)});
</script>

  ${field('sprice', 'سعر البيع لكل 1000 ($)', 'number')}<div class="grid g2"><div>${field('smin', 'الحد الأدنى', 'number')}</div><div>${field('smax', 'الحد الأقصى', 'number')}</div></div>
  <label for="sprov">المزود (اتركه فارغاً للتنفيذ اليدوي)</label><select id="sprov" class="inp"><option value="">— يدوي —</option>${opt(p.data || [])}</select>${field('spsid', 'رقم الخدمة عند المزود (Service ID)')}
  <label class="row"><input type="checkbox" id="sactive" checked> مفعّلة</label><button class="btn full" data-a="savesvc">حفظ الخدمة</button></div>
  <div class="card"><h3>التصنيفات</h3><div class="row"><input id="cname" class="inp" style="flex:1" placeholder="اسم تصنيف جديد"><button class="btn" data-a="addcat">إضافة</button></div>
  <p class="mu">${(c.data || []).map(x => esc(x.name)).join(' · ') || 'لا توجد تصنيفات بعد. أضف تصنيفاً أولاً.'}</p></div></div>
  <div class="card" style="margin-top:1rem">${tbl(['ID','الاسم','التصنيف','السعر/1000','الحدود','الحالة',''], CACHE.asv.map(x => [x.id, esc(x.name), esc(cn[x.category_id] || '-'), money(x.price_per_1000), `${x.min_qty}–${x.max_qty}`, x.active ? 'مفعّلة' : 'متوقفة', `<button class="btn ghost sm" data-a="editsvc" data-v="${x.id}">تعديل</button>`]))}</div>`;
 },
 async providers() {
  const { data } = await sb.from('providers').select('*').order('id');
  return `<div class="grid g2"><div class="card"><h3>إضافة مزود</h3>${field('pname', 'اسم المزود')}${field('purl', 'رابط الـ API (https)', 'url')}${field('pkey', 'API Key', 'password')}
  <button class="btn full" data-a="addprov">حفظ المزود</button><p class="mu">المفتاح يُحفظ على الخادم فقط ولا يظهر لأحد بعد الحفظ.</p></div>
  <div class="card"><h3>مزامنة الطلبات</h3><p class="mu">تجلب حالة الطلبات قيد التنفيذ من المزودين وتُرجع الأرصدة للملغي والجزئي.</p><button class="btn" data-a="sync">مزامنة الآن</button></div></div>
  <div class="card" style="margin-top:1rem">${tbl(['ID','الاسم','الرابط','الحالة',''], (data || []).map(x => [x.id, esc(x.name), esc(x.api_url), x.active ? 'مفعّل' : 'معطّل', `<button class="btn ghost sm" data-a="togprov" data-v="${x.id}" data-s="${x.active ? 0 : 1}">${x.active ? 'تعطيل' : 'تفعيل'}</button>`]))}</div>`;
 },
 async orders() {
  const { data } = await sb.from('orders').select('*').order('id', {ascending:false}).limit(200);
  const SEL = ['Pending', 'Processing', 'Completed', 'Partial', 'Failed'];
  return `<div class="card">${tbl(['#','الخدمة','الرابط','الكمية','الإجمالي','الحالة','خطأ',''], (data || []).map(x => ['#' + x.id, x.service_id, `<span dir="ltr">${esc(x.link)}</span>`, x.quantity, money(x.total),
   ['Refunded', 'Canceled'].includes(x.status) ? tag(x.status) : `<select class="inp" style="width:auto" data-c="ostatus" data-v="${x.id}">${SEL.map(s => `<option value="${s}" ${s == x.status ? 'selected' : ''}>${LBL[s]}</option>`).join('')}</select>`,
   esc(x.error || ''), ['Refunded', 'Canceled'].includes(x.status) ? '' : `<button class="btn ghost sm" data-a="refund" data-v="${x.id}">استرداد</button>`]))}</div>`;
 },
 async payments() {
  const { data } = await sb.from('payments').select('*').order('id', {ascending:false}).limit(200);
  return `<div class="card">${tbl(['#','المستخدم','الوسيلة','المبلغ','ملاحظة','الحالة',''], (data || []).map(x => [x.id, esc(x.user_id.slice(0, 8)), esc(x.method), money(x.amount), esc(x.note), PAY[x.status], x.status == 'pending' ? `<button class="btn sm" data-a="approve" data-v="${x.id}">قبول وشحن</button> <button class="btn ghost sm" data-a="reject" data-v="${x.id}">رفض</button>` : '']))}</div>`;
 },
 async users() {
  const { data } = await sb.from('profiles').select('id,username,role,banned,wallets(balance)').order('created_at', {ascending:false}).limit(200);
  return `<div class="card">${tbl(['المستخدم','الدور','الرصيد','الحالة',''], (data || []).map(x => [esc(x.username) + `<br><small class="mu">${x.id.slice(0, 8)}</small>`, ROLE[x.role] || x.role, money(x.wallets?.balance), x.banned ? 'موقوف' : 'نشط',
   `<button class="btn ghost sm" data-a="adjust" data-v="${x.id}">تعديل الرصيد</button> <button class="btn ghost sm" data-a="ban" data-v="${x.id}" data-s="${x.banned ? 0 : 1}" data-r="${x.role}">${x.banned ? 'رفع الحظر' : 'حظر'}</button>`]))}</div>`;
 },
 tickets: () => ticketList(true),
 async logs() {
  const { data } = await sb.from('audit_logs').select('*').order('id', {ascending:false}).limit(100);
  return `<div class="card">${tbl(['التاريخ','العملية','التفاصيل'], (data || []).map(x => [new Date(x.created_at).toLocaleString(LOC()), esc(x.action), `<small dir="ltr">${esc(JSON.stringify(x.details))}</small>`]))}</div>`;
 },
 async settings() {
  const lang = T.lang == 'en' ? 'en' : 'ar';
  return `<div class="card" style="max-width:680px"><h3>الثيم والألوان</h3>
  <div class="row">${[['navy', 'كحلي وبنفسجي (الافتراضي)'], ['ocean', 'أزرق محيط'], ['emerald', 'أخضر زمردي'], ['rose', 'وردي'], ['gold', 'ذهبي'], ['light', 'فاتح']].map(p => `<button class="btn ghost sm" data-a="preset" data-v="${p[0]}">${p[1]}</button>`).join('')}</div>
  <div class="grid g4">${[['tc1', 'اللون الأساسي', T.ac], ['tc2', 'لون البطاقات', T.nv], ['tc3', 'الخلفية', T.bg], ['tc4', 'لون النص', T.tx]].map(c => `<div>${field(c[0], c[1], 'color', c[2])}</div>`).join('')}</div>
  <label for="trad">استدارة الزوايا</label><input id="trad" type="range" min="0" max="28" value="${T.radius}" class="inp"></div>
  <div class="card" style="max-width:680px;margin-top:1rem"><h3>الهوية</h3><div class="grid g2"><div>${field('tna', 'اسم الموقع (عربي)', 'text', T.name_ar)}</div><div>${field('tne', 'Site name (English)', 'text', T.name_en)}</div></div>
  ${field('tl', 'اللوجو (إيموجي أو رمز)', 'text', T.logo)}<label for="tfile">أو ارفع صورة اللوجو (PNG/JPG/WEBP حتى 1 ميجا)</label><input id="tfile" type="file" accept="image/png,image/jpeg,image/webp" class="inp">
  <div class="row" style="margin-top:.6rem"><button class="btn ghost sm" data-a="uplogo">رفع الصورة</button><button class="btn ghost sm" data-a="rmlogo">استخدام الإيموجي بدل الصورة</button></div>
  <label for="tlang">اللغة الافتراضية</label><select id="tlang" class="inp"><option value="ar" ${lang == 'ar' ? 'selected' : ''}>العربية</option><option value="en" ${lang == 'en' ? 'selected' : ''}>English</option></select></div>
  <div class="card" style="max-width:680px;margin-top:1rem"><h3>محتوى الصفحة الرئيسية والتواصل</h3>
  ${field('thar', 'عنوان الصفحة الرئيسية (عربي)', 'text', T.hero_ar)}${field('then', 'Home headline (English)', 'text', T.hero_en)}${field('tsar', 'وصف الصفحة الرئيسية (عربي)', 'text', T.sub_ar)}${field('tsen', 'Home subtitle (English)', 'text', T.sub_en)}
  ${field('twa', 'رقم واتساب (مع كود الدولة)', 'text', T.whatsapp)}${field('ttg', 'يوزر تيليجرام', 'text', T.telegram)}${field('tem', 'بريد التواصل', 'email', T.email)}
  <label for="tp">بيانات الدفع (تظهر للعميل في صفحة الشحن)</label><textarea id="tp" class="inp" rows="3">${esc(CACHE.pay || '')}</textarea><button class="btn full" data-a="savesettings">حفظ الإعدادات</button></div>`;
 }}};
V.admin.settings.hook = () => {
  const read = () => { T = {...T, name_ar:val('tna'), name_en:val('tne'), logo:val('tl'), lang:val('tlang'), ac:val('tc1'), nv:val('tc2'), bg:val('tc3'), tx:val('tc4'), radius:+val('trad'),
    hero_ar:val('thar'), hero_en:val('then'), sub_ar:val('tsar'), sub_en:val('tsen'), whatsapp:val('twa'), telegram:val('ttg'), email:val('tem')}; applyTheme(); };
  $$('#tna,#tne,#tl,#tlang,#tc1,#tc2,#tc3,#tc4,#trad,#thar,#then,#tsar,#tsen,#twa,#ttg,#tem').forEach(e => e.oninput = read);
};

/* ---------- Actions ---------- */
const A = {
 async logout() { await sb.auth.signOut(); location.hash = '#/'; },
 lang() { LANG = LANG == 'en' ? 'ar' : 'en'; try { localStorage.setItem('lang', LANG); } catch (e) {} route(); },
 async auth(v) {
  const id = val('em'), pw = $('#pw').value;
  try {
   if (v == 'reg') {
    const un = val('un');
    if (!/^[A-Za-z0-9_]{3,20}$/.test(un)) return toast('اسم المستخدم 3–20 حرفاً (إنجليزي أو أرقام أو _)', false);
    if (pw.length < 8) return toast('كلمة المرور 8 أحرف على الأقل', false);
    const r = await sb.auth.signUp({email:id, password:pw, options:{data:{username:un}}}); if (r.error) throw r.error;
    if (!r.data.session) return toast('تحقق من بريدك لتفعيل الحساب');
   } else if (id.includes('@')) {
    const r = await sb.auth.signInWithPassword({email:id, password:pw}); if (r.error) throw r.error;
   } else {
    const j = await apiPublic('/api/login', {identifier:id, password:pw});
    const r = await sb.auth.setSession({access_token:j.access_token, refresh_token:j.refresh_token}); if (r.error) throw r.error;
   }
   location.hash = '#/app/home';
  } catch (e) { toast(/database error/i.test(e.message || '') ? 'اسم المستخدم مستخدم بالفعل أو غير صالح' : emsg(e), false); }
 },
 async order() {
  const b = $('#nb'); b.disabled = true;
  try { const r = await api('/api/orders', {service_id:+val('ns'), link:val('nl'), quantity:+val('nq'), key:ORDER_KEY}); toast('تم إنشاء الطلب #' + r.order_id); ORDER_KEY = uuid(); location.hash = '#/app/orders'; }
  catch (e) { toast(e.message, false); b.disabled = false; }
 },
 async deposit() { if (await ok(sb.rpc('request_deposit', {p_method:val('pm'), p_amount:+val('pa'), p_note:val('pn')}), 'تم إرسال طلب الشحن للمراجعة')) route(); },
 async newticket() {
  if (!val('tsub') || !val('tbody')) return toast('اكتب الموضوع والرسالة', false);
  const t = await ok(sb.from('support_tickets').insert({user_id:me.id, subject:val('tsub')}).select('id').single()); if (!t) return;
  await ok(sb.from('ticket_messages').insert({ticket_id:t.data.id, sender:me.id, body:val('tbody')}), 'تم فتح التذكرة'); route();
 },
 async reply(id, b) { if (!val('rb')) return; if (await ok(sb.from('ticket_messages').insert({ticket_id:+id, sender:me.id, is_staff:b.dataset.s == '1', body:val('rb')}), 'تم الإرسال')) route(); },
 async savesvc() {
  const row = {name:val('sname'), category_id:+val('scat') || null, description:val('sdesc'), price_per_1000:+val('sprice'), min_qty:+val('smin'), max_qty:+val('smax'),
   provider_id:+val('sprov') || null, provider_service_id:val('spsid') || null, active:$('#sactive').checked};
  if (val('sid')) row.id = +val('sid');
  if (await ok(sb.from('services').upsert(row), 'تم حفظ الخدمة')) route();
 },
 editsvc(id) {
  const s = CACHE.asv.find(x => x.id == id); if (!s) return;
  const set = (k, v) => $('#' + k).value = v ?? ''; set('sid', s.id); set('sname', s.name); set('scat', s.category_id); set('sdesc', s.description); set('sprice', s.price_per_1000);
  set('smin', s.min_qty); set('smax', s.max_qty); set('sprov', s.provider_id); set('spsid', s.provider_service_id); $('#sactive').checked = s.active; scrollTo(0, 0);
 },
 async addcat() { if (val('cname') && await ok(sb.from('categories').insert({name:val('cname')}), 'تمت إضافة التصنيف')) route(); },
 async addprov() { try { await api('/api/admin/provider', {name:val('pname'), api_url:val('purl'), api_key:val('pkey')}); toast('تم حفظ المزود'); route(); } catch (e) { toast(e.message, false); } },
 async togprov(id, b) { if (await ok(sb.from('providers').update({active:b.dataset.s == '1'}).eq('id', id))) route(); },
 async sync() { try { const r = await api('/api/admin/sync'); toast(`تم تحديث ${r.updated} طلب`); } catch (e) { toast(e.message, false); } },
 async refund(id) { if (confirm(tr('استرداد الطلب #' + id + ' وإرجاع المبلغ للعميل؟')) && await ok(sb.rpc('refund_order', {p_id:+id}), 'تم الاسترداد')) route(); },
 async approve(id) { if (await ok(sb.rpc('approve_payment', {p_id:+id}), 'تم قبول الدفعة وشحن الرصيد')) route(); },
 async adjust(id) {
  const amt = prompt(tr('المبلغ (موجب للإضافة، سالب للخصم):')); if (!amt) return; const why = prompt(tr('سبب التعديل (إلزامي):')); if (!why) return;
  if (await ok(sb.rpc('admin_adjust_balance', {p_user:id, p_amount:+amt, p_reason:why}), 'تم تعديل الرصيد')) route();
 },
 async ban(id, b) { if (await ok(sb.rpc('admin_set_user', {p_user:id, p_banned:b.dataset.s == '1', p_role:b.dataset.r}), 'تم التحديث')) route(); },
 preset(k) { Object.assign(T, PRESETS[k]); $('#tc1').value = T.ac; $('#tc2').value = T.nv; $('#tc3').value = T.bg; $('#tc4').value = T.tx; applyTheme(); },
 async uplogo() {
  const f = $('#tfile').files[0]; if (!f) return toast('اختر صورة أولاً', false);
  if (!['image/png', 'image/jpeg', 'image/webp'].includes(f.type) || f.size > 1048576) return toast('صورة PNG أو JPG أو WEBP بحد أقصى 1 ميجا', false);
  const path = 'logo-' + Date.now() + '.' + f.type.split('/')[1];
  if (!await ok(sb.storage.from('branding').upload(path, f, {contentType:f.type}))) return;
  T.logo_url = sb.storage.from('branding').getPublicUrl(path).data.publicUrl; applyTheme(); toast('تم رفع اللوجو — اضغط حفظ الإعدادات');
 },
 rmlogo() { T.logo_url = ''; applyTheme(); },
 async reject(id) { if (await ok(sb.rpc('reject_payment', {p_id:+id}), 'تم رفض الدفعة')) route(); },
 async chpw() {
  const a = $('#np').value; if (a.length < 8) return toast('كلمة المرور 8 أحرف على الأقل', false); if (a != $('#np2').value) return toast('كلمتا المرور غير متطابقتين', false);
  if (await ok(sb.auth.updateUser({password:a}), 'تم تغيير كلمة المرور')) { $('#np').value = ''; $('#np2').value = ''; }
 },
 async savesettings() {
  const site = {name_ar:T.name_ar, name_en:T.name_en, logo:T.logo, logo_url:T.logo_url, hero_ar:T.hero_ar, hero_en:T.hero_en, sub_ar:T.sub_ar, sub_en:T.sub_en,
   whatsapp:T.whatsapp, telegram:T.telegram, email:T.email, lang:T.lang, radius:T.radius, colors:{ac:T.ac, nv:T.nv, bg:T.bg, tx:T.tx}};
  if (await ok(sb.from('settings').upsert([{key:'site', value:site, is_public:true}, {key:'payment_info', value:val('tp'), is_public:true}]), 'تم حفظ الإعدادات')) CACHE.pay = val('tp');
 }};
document.addEventListener('click', e => { const b = e.target.closest('[data-a]'); if (!b) return; e.preventDefault(); A[b.dataset.a]?.(b.dataset.v, b); });
document.addEventListener('change', async e => {
 const c = e.target.dataset?.c; if (!c) return;
 if (c == 'ostatus') await ok(sb.from('orders').update({status:e.target.value}).eq('id', e.target.dataset.v), 'تم تحديث الحالة');
 if (c == 'tstatus') await ok(sb.from('support_tickets').update({status:e.target.value}).eq('id', e.target.dataset.v), 'تم تحديث التذكرة');
});

/* ---------- Router ---------- */
async function route() {
  const p = location.hash.replace(/^#\/?/, '').split('/'), a = $('#app'); HOOK = null;
  try {
    if (p[0] == 'login' || p[0] == 'register') a.innerHTML = authView(p[0] == 'register');
    else if (p[0] == 'legal' && LEGAL[p[1]]) a.innerHTML = legal(p[1]);
    else if (p[0] == 'app' || p[0] == 'admin') {
      if (!me) { location.hash = '#/login'; return; }
      if (p[0] == 'admin' && !isAdmin) { location.hash = '#/app/home'; return; }
      const k = p[0] == 'app' ? 'user' : 'admin', pg = p[1] || 'home';
      a.innerHTML = shell(k, pg, '<p class="mu">جارٍ التحميل…</p>');
      const body = pg.startsWith('ticket-') ? await ticketThread(+pg.slice(7), k == 'admin') : await (V[k][pg] || V[k].home)();
      a.innerHTML = shell(k, pg, body);
      if (k == 'admin' && pg == 'settings') V.admin.settings.hook();
    } else a.innerHTML = await landing();
  } catch (e) { a.innerHTML = `<div class="wrap"><div class="card">حدث خطأ في التحميل: ${esc(e.message)}</div></div>`; }
  a.dataset.ok = '1'; applyTheme(); tDom($('#app')); HOOK && HOOK();
}
async function init() {
  try {
    const C = window.APP_CONFIG || {};
    let url = C.supabaseUrl, anon = C.supabaseAnonKey;
    if (!url || !anon) {
      const r = await fetch((C.apiBase || '') + '/api/config');
      if (!r.ok) throw new Error('تعذر جلب إعدادات Supabase');
      const j = await r.json(); url = j.url; anon = j.anon;
    }
    sb = supabase.createClient(url, anon);
    const { data } = await sb.auth.getSession(); await setUser(data.session?.user); await loadTheme(); if (!LANG) LANG = T.lang || 'ar';
    sb.auth.onAuthStateChange(async (ev, s) => { if (ev == 'SIGNED_IN' || ev == 'SIGNED_OUT') { await setUser(s?.user); route(); } });
    addEventListener('hashchange', () => { const h = location.hash; if (h && !h.startsWith('#/') && h != '#') $(h)?.scrollIntoView(); else route(); });
    route();
  } catch (e) {
    $('#app').dataset.ok = '1';
    $('#app').innerHTML = `<div class="auth"><div class="card"><h2>الموقع غير مُعدّ بعد</h2><p class="mu">شغّل الموقع عبر الخادم (uvicorn) أو املأ ملف config.js ببيانات Supabase ثم أعد تحميل الصفحة.</p><p class="mu" style="font-size:.8rem">${esc(e.message)}</p></div></div>`;
  }
}
document.addEventListener('keydown', e => { if (e.key == 'Enter' && e.target.closest?.('.auth') && e.target.tagName == 'INPUT') $('[data-a=auth]')?.click(); });
init();

</script>
